name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump ${{ github.event.inputs.bump }} and push tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: current
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Compute new version
        id: next
        run: |
          CUR="${{ steps.current.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR"
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      - name: Update Cargo.toml
        run: |
          sed -i "s/^version = \"${{ steps.current.outputs.version }}\"/version = \"${{ steps.next.outputs.version }}\"/" Cargo.toml

      - name: Update src/main.rs clap version
        run: |
          # clap derive uses Cargo.toml automatically; nothing to do for the Rust binary itself.
          # If you maintain a hardcoded version in main.rs, patch it here.
          true

      - name: Create branch + bump commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="bump/v${{ steps.next.outputs.version }}"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Version unchanged (${C:-${{ steps.current.outputs.version }}}), skipping commit."
          else
            git commit -m "chore(release): bump version to v${{ steps.next.outputs.version }}"
          fi

      - name: Push branch
        run: git push origin HEAD

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(release): bump version to v${{ steps.next.outputs.version }}"
          body: "Automated version bump to **v${{ steps.next.outputs.version }}**.\n\nTriggered by workflow_dispatch with bump type: ${{ github.event.inputs.bump }}."
          branch: bump/v${{ steps.next.outputs.version }}
          base: beta
          labels: release

      - name: Output merge instructions
        run: |
          echo ""
          echo "=== Manual merge steps ==="
          echo "After merging the PR:"
          echo "  git checkout beta && git pull"
          echo "  git tag -a v${{ steps.next.outputs.version }} -m 'Release v${{ steps.next.outputs.version }}'"
          echo "  git push origin v${{ steps.next.outputs.version }}"
          echo "Then release.yml will trigger automatically."