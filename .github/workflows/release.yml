name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to rebuild (npm tag: beta → beta, main → latest)'
        type: choice
        required: true
        default: 'beta'
        options:
          - beta
          - main

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch || github.ref_name }}"
          if [ "$BRANCH" = "beta" ]; then
            # beta manual: lanjut dari versi beta terakhir di npm, bukan Cargo.toml/package.json
            BASE=$(npm view commitlg@beta version 2>/dev/null || echo "0.0.0")
            BASE=${BASE#v}
            MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
            V="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Beta: lanjut dari $BASE -> v$V"
          else
            V=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            # sync package.json in the workspace so both match before publishing
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" package.json
            echo "Releasing v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} x64
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: clg-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clg-win32-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_STRIP: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp "target/${{ matrix.target }}/release/clg.exe" "artifacts/clg.exe"
          else
            cp "target/${{ matrix.target }}/release/clg" "artifacts/clg.exe"
            strip "artifacts/clg.exe" || true
          fi
          ls -la artifacts/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/clg.exe

  publish:
    name: Publish to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Resolve npm_tag from branch
        id: tag
        run: |
          if [ "${{ inputs.branch || github.ref_name }}" = "main" ]; then
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage package
        shell: bash
        run: |
          mkdir -p bin
          cp artifacts/clg-linux-x64/clg.exe bin/commitlg-cli-linux-x64
          cp artifacts/clg-win32-x64/clg.exe bin/commitlg-cli-win-x64.exe
          chmod +x bin/commitlg-cli-linux-x64 bin/clg.js
          ls -la bin/

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.tag.outputs.npm_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not configured. Skipping publish."
            exit 0
          fi
          VERSION=${VERSION#v}
          # versi sudah pernah dipublish (mis. sama dengan versi terbaru) → jangan error, skip
          if npm view "commitlg@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published on npm — skipping publish (not an error)."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          npm publish --tag "${NPM_TAG}"
