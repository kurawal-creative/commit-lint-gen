name: Publish

on:
  push:
    branches:
      - beta
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.2). Format vMAJOR.MINOR.PATCH'
        required: false
        default: ''
      npm_tag:
        description: 'npm dist-tag: latest, beta, next'
        type: choice
        required: true
        default: 'beta'
        options:
          - latest
          - beta
          - next
      dry_run:
        description: 'Dry run — skip publish'
        type: choice
        required: true
        default: 'false'
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} x64
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: clg-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clg-win32-x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_STRIP: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp "target/${{ matrix.target }}/release/clg.exe" "artifacts/clg.exe"
          else
            cp "target/${{ matrix.target }}/release/clg" "artifacts/clg.exe"
            strip "artifacts/clg.exe" || true
          fi
          ls -la artifacts/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/clg.exe

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + npm_tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" = "beta" ]; then
            VERSION="v$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          else
            echo "ERROR: No version provided."
            exit 1
          fi
          if [ -n "${{ github.event.inputs.npm_tag }}" ]; then
            NPM_TAG="${{ github.event.inputs.npm_tag }}"
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            NPM_TAG="beta"
          else
            NPM_TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (${NPM_TAG})"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage package
        shell: bash
        run: |
          mkdir -p bin
          cp artifacts/clg-linux-x64/clg.exe bin/commitlg-cli-linux-x64
          cp artifacts/clg-win32-x64/clg.exe bin/commitlg-cli-win-x64.exe
          chmod +x bin/commitlg-cli-linux-x64 bin/clg.exe
          ls -la bin/

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not configured. Skipping publish."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          VERSION=${VERSION#v}
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          npm publish --tag "${NPM_TAG}"
