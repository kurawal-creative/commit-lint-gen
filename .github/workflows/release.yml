name: Publish

on:
  # Setiap push ke beta/main otomatis publish versi baru (diminta eksplisit).
  push:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to rebuild (npm tag: beta → beta, main → latest)'
        type: choice
        required: true
        default: 'beta'
        options:
          - beta
          - main

permissions:
  contents: read

# Jangan pernah dua publish berjalan bersamaan: resolusi versi baca npm registry.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve version (auto-bump from npm)
        id: resolve
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then TAG=latest; else TAG=beta; fi

          # Versi dari section [package] saja (aman untuk workspace / version lain).
          cargo_version() {
            node -e '
          const fs = require("fs");
          let inPackage = false;
          for (const line of fs.readFileSync("Cargo.toml", "utf8").split("\n")) {
            if (/^\[package\]/.test(line)) inPackage = true;
            else if (/^\[/.test(line)) inPackage = false;
            else if (inPackage && /^version\s*=/.test(line)) {
              process.stdout.write(line.split("=").slice(1).join("=").trim().replace(/^"|"$/g, ""));
              break;
            }
          }'
          }

          # Output kosong = package/tag belum ada (404). Error lain menggagalkan job.
          npm_version_or_empty() {
            local ref="$1" err
            err=$(mktemp)
            if npm view "$ref" version 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            if grep -q 'E404' "$err"; then
              rm -f "$err"
              return 0
            fi
            cat "$err" >&2
            rm -f "$err"
            return 1
          }

          CARGO_V=$(cargo_version)
          if [ -z "$CARGO_V" ]; then
            echo "Could not read [package] version from Cargo.toml" >&2
            exit 1
          fi

          core_of() {
            local value="${1#v}"
            value="${value%%-*}"
            value="${value%%+*}"
            printf '%s' "$value"
          }
          bump_patch() {
            printf '%s' "$1" | awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }'
          }

          LATEST=$(npm_version_or_empty "commitlg@latest")
          [ -n "$LATEST" ] || LATEST="0.0.0"
          BETA=$(npm_version_or_empty "commitlg@beta")

          LATEST_CORE=$(core_of "$LATEST")
          CARGO_CORE=$(core_of "$CARGO_V")
          BUMPED=$(bump_patch "$LATEST_CORE")

          # Core stabil berikutnya: patch dari latest, atau Cargo.toml kalau lebih tinggi.
          CORE=$(printf '%s\n%s\n' "$BUMPED" "$CARGO_CORE" | sort -V | tail -1)
          case "${CORE//./}" in
            ''|*[!0-9]*)
              echo "Unparseable core version: $CORE (latest=$LATEST, cargo=$CARGO_V)" >&2
              exit 1
              ;;
          esac

          if [ "$TAG" = "beta" ]; then
            # Beta selalu di atas stable terakhir, format <core>-beta.<n>.
            N=0
            case "$BETA" in
              *-beta.*)
                BETA_CORE=$(core_of "$BETA")
                BETA_N=${BETA##*-beta.}
                if [ "$BETA_CORE" = "$CORE" ] && [ -n "$BETA_N" ] && [ -z "${BETA_N//[0-9]/}" ]; then
                  N=$BETA_N
                fi
                ;;
            esac
            V="$CORE-beta.$((N + 1))"
          else
            V="$CORE"
          fi

          # Pastikan versi belum pernah dipakai tag mana pun.
          ATTEMPTS=0
          while :; do
            PUBLISHED=$(npm_version_or_empty "commitlg@${V}") || exit 1
            [ -z "$PUBLISHED" ] && break
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -gt 50 ]; then
              echo "Could not find a free version near v$V" >&2
              exit 1
            fi
            case "$V" in
              *-beta.*)
                N=${V##*-beta.}
                V="${V%-beta.*}-beta.$((N + 1))"
                ;;
              *)
                V=$(bump_patch "$V")
                ;;
            esac
          done

          echo "Branch: $BRANCH | tag: $TAG | latest: v$LATEST | beta: v${BETA:-none} | Cargo.toml: v$CARGO_V -> v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} x64
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: clg-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clg-win32-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: clg-darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: clg-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Cross-platform, aman di BSD sed (macOS) dan PowerShell (Windows).
      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
          const fs = require("fs");
          const version = process.env.VERSION;
          let inPackage = false;
          const lines = fs.readFileSync("Cargo.toml", "utf8").split("\n").map((line) => {
            if (/^\[package\]/.test(line)) inPackage = true;
            else if (/^\[/.test(line)) inPackage = false;
            else if (inPackage && /^version\s*=/.test(line)) return `version = "${version}"`;
            return line;
          });
          fs.writeFileSync("Cargo.toml", lines.join("\n"));
          '
          node -e '
          const fs = require("fs");
          let inPackage = false;
          for (const line of fs.readFileSync("Cargo.toml", "utf8").split("\n")) {
            if (/^\[package\]/.test(line)) inPackage = true;
            else if (/^\[/.test(line)) inPackage = false;
            else if (inPackage && /^version\s*=/.test(line)) { console.log(line); break; }
          }
          '

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_STRIP: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

      # Binary name mengikuti [[bin]]/package di Cargo.toml (saat ini `clg`).
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p artifacts
          BIN=clg
          if [[ "${{ matrix.os }}" == windows* ]]; then
            BIN=clg.exe
          fi
          if [ ! -f "target/${{ matrix.target }}/release/$BIN" ]; then
            echo "Binary '$BIN' not found for ${{ matrix.target }}" >&2
            ls -la "target/${{ matrix.target }}/release/" || true
            exit 1
          fi
          cp "target/${{ matrix.target }}/release/$BIN" "artifacts/clg.exe"
          ls -la artifacts/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/clg.exe

  publish:
    name: Publish to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage package
        shell: bash
        run: |
          mkdir -p bin
          cp artifacts/clg-linux-x64/clg.exe bin/commitlg-cli-linux-x64
          cp artifacts/clg-win32-x64/clg.exe bin/commitlg-cli-win-x64.exe
          cp artifacts/clg-darwin-x64/clg.exe bin/commitlg-cli-darwin-x64
          cp artifacts/clg-darwin-arm64/clg.exe bin/commitlg-cli-darwin-arm64
          chmod +x bin/commitlg-cli-*
          ls -la bin/

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not configured — cannot publish."
            exit 1
          fi
          VERSION=${VERSION#v}
          # Auth npm sudah disiapkan setup-node (registry-url + NODE_AUTH_TOKEN).
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          npm publish --tag "${NPM_TAG}"
